# Standalone build of the mod's rules, for `cargo test` only. The game build
# doesn't use this file: the launcher compiles mixins/duels/ into Horizon.
[package]
name = "duels-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "mixins/duels/duels_core.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
